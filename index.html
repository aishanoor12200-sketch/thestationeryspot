<script>
// 1. Search Box Function
function searchItems() {
    let input = document.getElementById("searchInput").value.toLowerCase();
    let cards = document.querySelectorAll(".card");
    let resultsBox = document.getElementById("searchResults");

    resultsBox.innerHTML = "";

    if (input === "") {
        resultsBox.style.display = "none";
        return;
    }

    resultsBox.style.display = "block";

    cards.forEach(card => {
        let text = card.querySelector(".name").innerText.toLowerCase();

        if (text.includes(input)) {
            let item = document.createElement("div");
            item.innerText = card.querySelector(".name").innerText;

            item.onclick = function() {
                card.scrollIntoView({ behavior: "smooth" });
                resultsBox.style.display = "none";
            };

            resultsBox.appendChild(item);
        }
    });
}

// 2. Cart Functions
let cart = [];

function addToCart(btn, code) {
    let card = btn.closest(".card");
    let name = card.querySelector(".name").innerText;
    let priceText = card.querySelector(".price").innerText;
    let price = Number(priceText.replace(/[^0-9]/g, ""));
    let qty = Number(card.querySelector(".qty").innerText);
    let itemTotal = price * qty;

    cart.push({
        name: name,
        code: code,
        qty: qty,
        total: itemTotal
    });

    showOrderBox(btn);
    alert("Added: " + name);
}

function sendWhatsAppOrder() {
    if(cart.length === 0){
        alert("Cart empty!");
        return;
    }

    let msg = "🛒 ORDER:\n\n";
    let total = 0;

    cart.forEach(i=>{
        msg += i.name+" ("+i.code+") x "+i.qty+" = Rs."+i.total+"\n";
        total += i.total;
    });

    msg += "\nTOTAL: Rs."+total;
    window.open("https://wa.me/923271576380?text=" + encodeURIComponent(msg));
}

function increase(btn){
  btn.parentElement.querySelector(".qty").innerText++;
}

function decrease(btn){
  let q = btn.parentElement.querySelector(".qty");
  if(q.innerText > 1) q.innerText--;
}

// 3. Popup Image Functions
function openImage(src){
  document.getElementById("imagePopup").style.display="flex";
  document.getElementById("popupImg").src = src;
}

function closeImage(){
  document.getElementById("imagePopup").style.display="none";
}

function showOrderBox(btn) {
    let floatBtn = document.getElementById("floatingBtn");
    floatBtn.style.display = "block";
    setTimeout(() => {
        floatBtn.style.display = "none";
    }, 10000);
} 

// 4. Mobile Menu Toggle Function (Open & Close Dono Ke Liye)
function toggleMenu() {
    let menu = document.querySelector(".mobile-menu");
    menu.classList.toggle("open");
}
</script>
