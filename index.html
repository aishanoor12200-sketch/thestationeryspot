     PRODUCT SEARCH
========================= --><script>

let stationeryProducts = [];
let stationeryProductsReady = false;


/* =========================
   LOAD ALL PRODUCTS
========================= */

fetch("data/products.json")

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Products could not be loaded."
            );

        }

        return response.json();

    })

    .then(products => {

        stationeryProducts =
            Array.isArray(products)
                ? products
                : [];


        stationeryProductsReady =
            true;


        document.dispatchEvent(
            new Event(
                "stationeryProductsReady"
            )
        );

    })

    .catch(error => {

        console.error(
            "Search products load error:",
            error
        );

        stationeryProductsReady =
            false;

    });


/* =========================
   SEARCH FUNCTION
========================= */

function searchItems() {

    const inputElement =
        document.getElementById(
            "searchInput"
        );

    const resultsBox =
        document.getElementById(
            "searchResults"
        );


    if (
        !inputElement ||
        !resultsBox
    ) {
        return;
    }


    const input =
        inputElement.value
            .trim()
            .toLowerCase();


    resultsBox.innerHTML = "";


    /* =========================
       EMPTY SEARCH
    ========================= */

    if (input === "") {

        resultsBox.style.display =
            "none";

        return;

    }


    /* =========================
       PRODUCTS STILL LOADING
    ========================= */

    if (!stationeryProductsReady) {

        resultsBox.innerHTML =
            "<div>Loading products...</div>";

        resultsBox.style.display =
            "block";

        return;

    }


    /* =========================
       SEARCH ALL PRODUCTS
    ========================= */

    const matches =
        stationeryProducts
            .filter(product => {

                if (
                    product.available === false
                ) {
                    return false;
                }


                const name =
                    String(
                        product.name || ""
                    ).toLowerCase();


                const category =
                    String(
                        product.category || ""
                    ).toLowerCase();


                const code =
                    String(
                        product.code || ""
                    ).toLowerCase();


                return (
                    name.includes(input) ||
                    category.includes(input) ||
                    code.includes(input)
                );

            })
            .slice(0, 12);


    /* =========================
       NO RESULTS
    ========================= */

    if (
        matches.length === 0
    ) {

        resultsBox.innerHTML =
            "<div>No product found</div>";

        resultsBox.style.display =
            "block";

        return;

    }


    /* =========================
       SHOW RESULTS
    ========================= */

    matches.forEach(product => {

        const item =
            document.createElement(
                "div"
            );


        item.className =
            "search-result-item";


        item.style.padding =
            "9px 10px";

        item.style.cursor =
            "pointer";

        item.style.borderRadius =
            "8px";


        item.innerHTML = `

            <strong
                style="
                    display:block;
                "
            >
                ${product.name}
            </strong>


            <small
                style="
                    display:block;
                    color:#888;
                    margin-top:2px;
                "
            >
                ${product.category}
                · Rs.${product.price}
            </small>

        `;


        /* =========================
           HOVER EFFECT
        ========================= */

        item.addEventListener(
            "mouseenter",
            () => {

                item.style.background =
                    "#fff0f5";

            }
        );


        item.addEventListener(
            "mouseleave",
            () => {

                item.style.background =
                    "transparent";

            }
        );


        /* =========================
           CLICK RESULT
        ========================= */

        item.addEventListener(
            "click",
            () => {

                const cards =
                    document.querySelectorAll(
                        "product-card"
                    );


                let targetCard =
                    null;


                /*
                   Match using code + image.
                   This avoids problems when
                   product codes are duplicated.
                */

                cards.forEach(card => {

                    if (
                        !targetCard &&

                        card.getAttribute(
                            "code"
                        ) === String(
                            product.code || ""
                        ) &&

                        card.getAttribute(
                            "image"
                        ) === String(
                            product.image || ""
                        )
                    ) {

                        targetCard =
                            card;

                    }

                });


                /* =========================
                   PRODUCT NOT FOUND ON PAGE
                ========================= */

                if (!targetCard) {

                    resultsBox.style.display =
                        "none";

                    return;

                }


                const categorySection =
                    targetCard.closest(
                        ".category"
                    );


                /* =========================
                   REVEAL HIDDEN PRODUCT
                ========================= */

                if (
                    targetCard.classList
                        .contains(
                            "extra-product"
                        )
                ) {

                    targetCard.classList
                        .remove(
                            "extra-product"
                        );


                    if (
                        categorySection
                    ) {

                        categorySection
                            .classList
                            .add(
                                "expanded"
                            );

                    }

                }


                /* =========================
                   CLOSE SEARCH
                ========================= */

                resultsBox.style.display =
                    "none";


                inputElement.value =
                    "";


                /* =========================
                   SCROLL TO PRODUCT
                ========================= */

                setTimeout(
                    () => {

                        targetCard.scrollIntoView({
                            behavior:
                                "smooth",

                            block:
                                "center"
                        });

                    },
                    100
                );

            }
        );


        resultsBox.appendChild(
            item
        );

    });


    resultsBox.style.display =
        "block";

}


/* =========================
   SEARCH AGAIN AFTER LOAD
========================= */

document.addEventListener(
    "stationeryProductsReady",
    () => {

        const inputElement =
            document.getElementById(
                "searchInput"
            );


        if (
            inputElement &&
            inputElement.value
                .trim() !== ""
        ) {

            searchItems();

        }

    }
);

</script><!-- =========================
     IMAGE POPUP JAVASCRIPT
========================= --><script>

function openImage(src) {

    const popup =
        document.getElementById(
            "imagePopup"
        );


    const popupImg =
        document.getElementById(
            "popupImg"
        );


    if (
        !popup ||
        !popupImg
    ) {
        return;
    }


    popupImg.src =
        src;


    popup.style.display =
        "flex";

}


function closeImage() {

    const popup =
        document.getElementById(
            "imagePopup"
        );


    if (!popup) {
        return;
    }


    popup.style.display =
        "none";

}

</script><!-- =========================
     CLOSE SEARCH
========================= --><script>

document.addEventListener(
    "click",
    function(event) {

        const searchBox =
            document.querySelector(
                ".search-box"
            );


        const resultsBox =
            document.getElementById(
                "searchResults"
            );


        if (
            searchBox &&
            resultsBox &&
            !searchBox.contains(
                event.target
            )
        ) {

            resultsBox.style.display =
                "none";

        }

    }
);

</script><!-- =========================
