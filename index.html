<!-- =========================
     SEARCH JAVASCRIPT
========================= -->

<script>

function searchItems() {

    const inputElement =
        document.getElementById("searchInput");

    const resultsBox =
        document.getElementById("searchResults");

    if (!inputElement || !resultsBox) {
        return;
    }


    const input =
        inputElement.value
        .trim()
        .toLowerCase();


    const cards =
        document.querySelectorAll(".card");


    resultsBox.innerHTML = "";


    if (input === "") {

        resultsBox.style.display = "none";

        return;
    }


    let found = false;


    cards.forEach(card => {

        const nameElement =
            card.querySelector(".name");

        if (!nameElement) {
            return;
        }


        const productName =
            nameElement.innerText.trim();


        if (
            productName
            .toLowerCase()
            .includes(input)
        ) {

            found = true;


            const item =
                document.createElement("div");


            item.innerText =
                productName;


            item.onclick = function() {

                card.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });


                resultsBox.style.display =
                    "none";

            };


            resultsBox.appendChild(item);

        }

    });


    if (found) {

        resultsBox.style.display =
            "block";

    } else {

        resultsBox.innerHTML =
            "<div>No product found</div>";

        resultsBox.style.display =
            "block";

    }

}

</script>


<!-- =========================
     IMAGE POPUP JAVASCRIPT
========================= -->

<script>

function openImage(src) {

    const popup =
        document.getElementById("imagePopup");

    const popupImg =
        document.getElementById("popupImg");


    if (!popup || !popupImg) {
        return;
    }


    popupImg.src =
        src;


    popup.style.display =
        "flex";

}


function closeImage() {

    const popup =
        document.getElementById("imagePopup");


    if (!popup) {
        return;
    }


    popup.style.display =
        "none";

}

</script>


<!-- =========================
     CLOSE SEARCH
========================= -->

<script>

document.addEventListener(
    "click",
    function(event) {

        const searchBox =
            document.querySelector(".search-box");

        const resultsBox =
            document.getElementById("searchResults");


        if (
            searchBox &&
            resultsBox &&
            !searchBox.contains(event.target)
        ) {

            resultsBox.style.display =
                "none";

        }

    }
);

</script>
