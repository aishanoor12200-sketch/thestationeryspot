<script>

/* =========================================
   SEARCH
========================================= */

function searchItems() {

    const input =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    const cards =
        document.querySelectorAll(".card");

    const resultsBox =
        document.getElementById("searchResults");


    resultsBox.innerHTML = "";


    if (input === "") {

        resultsBox.style.display = "none";

        return;
    }


    let found = false;


    cards.forEach(card => {

        const nameElement =
            card.querySelector(".name");

        if (!nameElement) return;


        const productName =
            nameElement.innerText.trim();


        if (
            productName
            .toLowerCase()
            .includes(input)
        ) {

            found = true;


            const item =
                document.createElement("div");

            item.innerText =
                productName;


            item.onclick = function () {

                card.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });

                resultsBox.style.display =
                    "none";

            };


            resultsBox.appendChild(item);

        }

    });


    if (found) {

        resultsBox.style.display =
            "block";

    } else {

        resultsBox.innerHTML =
            "<div>No product found</div>";

        resultsBox.style.display =
            "block";
    }

}


/* =========================================
   CART
========================================= */

let cart = [];


function addToCart(btn, code) {

    const card =
        btn.closest(".card");

    if (!card) return;


    const nameElement =
        card.querySelector(".name");

    const priceElement =
        card.querySelector(".price");

    const qtyElement =
        card.querySelector(".qty");


    if (
        !nameElement ||
        !priceElement ||
        !qtyElement
    ) {
        return;
    }


    const name =
        nameElement.innerText.trim();


    const priceText =
        priceElement.innerText;


    const price =
        Number(
            priceText.replace(/[^0-9]/g, "")
        );


    const qty =
        Number(qtyElement.innerText);


    if (
        !name ||
        !Number.isFinite(price) ||
        !Number.isFinite(qty) ||
        qty < 1
    ) {
        return;
    }


    const itemTotal =
        price * qty;


    cart.push({

        name: name,

        code: code || "",

        qty: qty,

        total: itemTotal

    });


    showOrderBox(btn);


    alert(
        "Added: " + name
    );

}


/* =========================================
   WHATSAPP ORDER
========================================= */

function sendWhatsAppOrder() {

    if (cart.length === 0) {

        alert("Cart empty!");

        return;
    }


    let msg =
        "🛒 ORDER:\n\n";


    let total = 0;


    cart.forEach(item => {

        msg +=
            item.name +
            " (" +
            item.code +
            ") x " +
            item.qty +
            " = Rs." +
            item.total +
            "\n";


        total += item.total;

    });


    msg +=
        "\nTOTAL: Rs." +
        total;


    const whatsappURL =
        "https://wa.me/923271576380?text=" +
        encodeURIComponent(msg);


    window.open(
        whatsappURL,
        "_blank",
        "noopener,noreferrer"
    );

}


/* =========================================
   QUANTITY
========================================= */

function increase(btn) {

    const qty =
        btn.parentElement
        .querySelector(".qty");


    if (!qty) return;


    let value =
        Number(qty.innerText);


    if (!Number.isFinite(value)) {

        value = 1;

    }


    qty.innerText =
        value + 1;

}


function decrease(btn) {

    const qty =
        btn.parentElement
        .querySelector(".qty");


    if (!qty) return;


    let value =
        Number(qty.innerText);


    if (!Number.isFinite(value)) {

        value = 1;

    }


    if (value > 1) {

        qty.innerText =
            value - 1;

    }

}


/* =========================================
   IMAGE POPUP
========================================= */

function openImage(src) {

    const popup =
        document.getElementById(
            "imagePopup"
        );


    const popupImg =
        document.getElementById(
            "popupImg"
        );


    if (!popup || !popupImg) return;


    popupImg.src = src;

    popup.style.display = "flex";

}


function closeImage() {

    const popup =
        document.getElementById(
            "imagePopup"
        );


    if (!popup) return;


    popup.style.display =
        "none";

}


/* =========================================
   FLOATING ORDER BUTTON
========================================= */

function showOrderBox(btn) {

    const floatBtn =
        document.getElementById(
            "floatingBtn"
        );


    if (!floatBtn) return;


    floatBtn.style.display =
        "block";


    clearTimeout(
        window.orderBoxTimer
    );


    window.orderBoxTimer =
        setTimeout(() => {

            floatBtn.style.display =
                "none";

        }, 10000);

}


/* =========================================
   MOBILE MENU
========================================= */

function toggleMenu() {

    const menu =
        document.getElementById(
            "mobileMenu"
        );


    if (!menu) return;


    menu.classList.toggle("open");

}


/* =========================================
   ESC KEY
========================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            closeImage();


            const menu =
                document.getElementById(
                    "mobileMenu"
                );


            if (
                menu &&
                menu.classList.contains("open")
            ) {

                menu.classList.remove("open");

            }

        }

    }
);


/* =========================================
   CLOSE SEARCH WHEN CLICKING OUTSIDE
========================================= */

document.addEventListener(
    "click",
    function(event) {

        const searchBox =
            document.querySelector(
                ".search-box"
            );

        const resultsBox =
            document.getElementById(
                "searchResults"
            );


        if (
            searchBox &&
            resultsBox &&
            !searchBox.contains(event.target)
        ) {

            resultsBox.style.display =
                "none";

        }

    }
);

</script>
