<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Stationery Spot</title>

    <link rel="stylesheet" href="Style.css">
    <link rel="stylesheet" href="sidebar.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="category-page-body">

    <!-- ================= HEADER ================= -->

    <header class="top-bar">

        <div class="logo-area">

            <!-- MOBILE MENU BUTTON -->
            <div class="menu-icon"
                 onclick="toggleMenu()">
                ☰
            </div>

            <!-- PC LOGO -->
            <a href="index.html">
                <img
                    src="images/images/IMG-20260515-WA0016.jpg"
                    class="pc-logo"
                    alt="The Stationery Spot">
            </a>

            <h1 class="top-heading">
                The Stationery Spot
            </h1>

        </div>


        <!-- DESKTOP MENU -->

        <nav class="left-menu">

            <a href="index.html">Home</a>
            <a href="deals.html">Deals</a>
            <a href="contact.html">Contact</a>
            <a href="Refund policy.html">Refund Policy</a>
            <a href="Shipping policy.html">Shipping Policy</a>

        </nav>


    </header>


    <!-- ================= MOBILE MENU ================= -->

    <div
        class="mobile-menu"
        id="mobileMenu">

        <button
            class="close-btn"
            type="button"
            onclick="toggleMenu()">
            ✕
        </button>

        <a href="index.html">Home</a>
        <a href="deals.html">Deals</a>
        <a href="contact.html">Contact</a>
        <a href="Refund policy.html">Refund Policy</a>
        <a href="Shipping policy.html">Shipping Policy</a>

    </div>


    <!-- ================= CATEGORY ================= -->

    <main>

        <section class="category-page">

            <h2 id="categoryTitle">
                Products
            </h2>

            <div
                id="categoryProducts"
                class="products category-products">
            </div>

        </section>

    </main>


    <script src="product-card.js"></script>
    <script src="category.js"></script>
    <script src="sidebar.js"></script>


    <!-- MENU -->

    <script>

        function toggleMenu() {

            const menu =
                document.getElementById("mobileMenu");

            if (menu) {
                menu.classList.toggle("open");
            }

        }

    </script>

</body>
</html>
