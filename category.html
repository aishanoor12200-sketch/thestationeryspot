<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The Stationery Spot</title>


    <!-- MAIN CSS -->
    <link rel="stylesheet" href="Style.css">

    <!-- SIDEBAR CSS -->
    <link rel="stylesheet" href="sidebar.css">


    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body class="category-page-body">


    <!-- ================= HEADER ================= -->

    <header class="top-bar">


        <div class="logo-area">


            <!-- MOBILE MENU -->

            <button
                class="menu-icon"
                type="button"
                onclick="openCommonSidebar()"
                aria-label="Open menu"
            >
                ☰
            </button>


            <!-- PC LOGO -->

            <a href="index.html">

                <img
                    src="images/images/IMG-20260515-WA0016.jpg"
                    class="pc-logo"
                    alt="The Stationery Spot"
                >

            </a>


            <h1 class="top-heading">
                The Stationery Spot
            </h1>


        </div>


        <!-- ================= DESKTOP MENU ================= -->

        <nav class="left-menu">

            <a href="index.html">
                Home
            </a>

            <a href="deals.html">
                Deals
            </a>

            <a href="contact.html">
                Contact
            </a>

            <a href="Refund policy.html">
                Refund Policy
            </a>

            <a href="Shipping policy.html">
                Shipping Policy
            </a>

        </nav>


    </header>



    <!-- ================= CATEGORY ================= -->

    <main>

        <section class="category-page">


            <h2 id="categoryTitle">
                Products
            </h2>


            <div
                id="categoryProducts"
                class="products category-products"
            >
            </div>


        </section>

    </main>

    <!-- =========================
     FLOATING ORDER BUTTON
========================= -->
<div class="floating-order" id="floatingBtn">
    <button
        class="btn"
        type="button"
        onclick="sendWhatsAppOrder()"
    >
        🛒 Done Your Order
    </button>
</div>



    <!-- ================= SCRIPTS ================= -->
<script src="product-card.js"></script>

<script src="cart.js"></script>

<script src="category.js"></script>

<script src="sidebar.js"></script>


</body>

</html>
